name: LLM Gateway Hunter
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'IP atau IP:PORT, dipisah baris baru'
        required: false
        default: ''
      cidr:
        description: 'CIDR opsional (scan segar, mis. 47.238.249.0/24)'
        required: false
        default: ''
      ports:
        description: 'Port kalau pakai cidr'
        default: '3000,3001,8000,8080,20128'
      workers:
        default: '250'
      timeout:
        description: 'timeout chat per model (detik)'
        default: '20'
      farm:
        description: 'true = bikin akun di new-api & cek bonus/checkin'
        default: 'false'
      portscan:
        description: 'true = scan port dulu (wajib untuk /16, hemat HTTP)'
        default: 'true'

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Siapkan daftar target
        run: |
          : > targets.txt
          if [ -n "${{ github.event.inputs.targets }}" ]; then
            printf '%s\n' "${{ github.event.inputs.targets }}" >> targets.txt
          fi
          sed -i '/^\s*$/d' targets.txt
          echo "manual targets: $(wc -l < targets.txt)"

      - name: Portscan CIDR (tahap 1)
        if: ${{ github.event.inputs.cidr != '' && github.event.inputs.portscan == 'true' }}
        run: |
          python tools/portscan.py \
            --cidr "${{ github.event.inputs.cidr }}" \
            --ports "${{ github.event.inputs.ports }}" \
            --concurrency 1500 --timeout 2.0 >> targets.txt 2> portscan.log || true
          tail -3 portscan.log
          sed -i '/^\s*$/d' targets.txt
          echo "setelah portscan: $(wc -l < targets.txt)"

      - name: Expand CIDR tanpa portscan
        if: ${{ github.event.inputs.cidr != '' && github.event.inputs.portscan != 'true' }}
        run: |
          python - >> targets.txt <<'PY'
          import ipaddress, os
          for c in os.environ["C"].split(","):
              c = c.strip()
              if not c:
                  continue
              for ip in ipaddress.ip_network(c, strict=False).hosts():
                  for p in os.environ["P"].split(","):
                      print("%s:%s" % (ip, p.strip()))
          PY
        env:
          C: ${{ github.event.inputs.cidr }}
          P: ${{ github.event.inputs.ports }}

      - name: Uji LLM (chat sungguhan + klasifikasi)
        run: |
          FARM=""
          if [ "${{ github.event.inputs.farm }}" = "true" ]; then FARM="--farm"; fi
          python tools/llm_hunt.py \
            --file targets.txt \
            --workers ${{ github.event.inputs.workers }} \
            --timeout ${{ github.event.inputs.timeout }} \
            --output llm_results.jsonl $FARM 2>&1 | tail -150

      - name: Tampilkan ringkasan
        if: always()
        run: cat llm_summary.txt 2>/dev/null || echo "(tidak ada hasil)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-results
          path: |
            llm_results.jsonl
            llm_summary.txt
            portscan.log
          retention-days: 14
